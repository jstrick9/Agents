openapi: 3.0.3
info:
  title: ONR ITSS POC — Advana / Cloud One interoperability API
  description: |
    Open, non-proprietary contract for enterprise consumers (Advana, Cloud One,
    legacy D&A Portal). Backed by the Databricks SQL Statement Execution API
    and Unity Catalog gold tables. Mock unclassified data only.

    Authentication is the workspace IdP (SSO + MFA). There is no static
    export URL. Losing group membership revokes access immediately (Zero Trust).
  version: 1.0.0
servers:
  - url: https://{deployment}.cloud.databricks.mil/api/2.0
    description: AWS GovCloud DoD (IL5)
    variables:
      deployment:
        default: onr-itss
  - url: https://{deployment}.cloud.databricks.us/api/2.0
    description: AWS GovCloud (FedRAMP High)
    variables:
      deployment:
        default: onr-itss
paths:
  /sql/statements:
    post:
      summary: Run a governed SQL statement and return rows
      operationId: executeStatement
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementRequest"
            examples:
              overrunExtract:
                value:
                  warehouse_id: "<serverless-warehouse-id>"
                  catalog: onr_itss_dev
                  schema: da_platform
                  wait_timeout: 30s
                  statement: >
                    SELECT grant_id, project_name, onr_code, award_amount,
                           projected_total, risk_class, trend_id
                    FROM gold_financial_execution
                    WHERE risk_class = 'OVERRUN'
              kpis:
                value:
                  warehouse_id: "<serverless-warehouse-id>"
                  catalog: onr_itss_dev
                  schema: da_platform
                  wait_timeout: 15s
                  statement: SELECT * FROM gold_executive_kpis
      responses:
        "200":
          description: Statement accepted / completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementResponse"
        "401":
          description: Missing or expired token
        "403":
          description: Authenticated but not authorized for the catalog/table
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PAT-or-OAuth
      description: OAuth M2M preferred. PAT max 730 days, stored in a GovCloud secret scope.
  schemas:
    StatementRequest:
      type: object
      required: [warehouse_id, statement]
      properties:
        warehouse_id:
          type: string
        catalog:
          type: string
          example: onr_itss_dev
        schema:
          type: string
          example: da_platform
        statement:
          type: string
        wait_timeout:
          type: string
          example: 30s
        disposition:
          type: string
          enum: [INLINE, EXTERNAL_LINKS]
          description: EXTERNAL_LINKS returns volume/cloud paths for bulk Parquet.
    StatementResponse:
      type: object
      properties:
        statement_id:
          type: string
        status:
          type: object
        manifest:
          type: object
          description: Column schema — portable types (STRING, DOUBLE, TIMESTAMP, ...)
        result:
          type: object
          description: Inline rows or external links to CSV/JSON/Parquet
tags:
  - name: interoperability
    description: Element 7 — prevent vendor lock-in
  - name: advana
  - name: cloud-one
