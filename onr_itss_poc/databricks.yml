# ONR ITSS POC — Databricks Asset Bundle (IaC declaration, Element 2)
# Workspace: https://dbc-ae83c2ba-d87c.cloud.databricks.com/?o=7474653232339519
# Folder:    /Workspace/Users/joshua.strickland@satsyil.com/onr_itss_poc
# Catalog:   onr_itss_poc.da_platform
#
# This Git folder is the source of truth. The medallion is Lakeflow-free: there is
# NO pipeline to create — `src/pipelines/medallion.sql` (plain SQL, run on the
# Serverless SQL warehouse) declares the streaming tables and materialized views,
# and `resources/pipelines.yml` is intentionally empty (it stays only as the
# extension point). `databricks bundle deploy -t dev` simply syncs the folder where
# the CLI is available; no cluster creation is required either way.

bundle:
  name: onr_itss_poc

include:
  - resources/*.yml

sync:
  include:
    - src/**
    - data/**
    - docs/**
  exclude:
    - src/dashboards/*.lvdash.json

variables:
  catalog:
    default: onr_itss_poc
  schema:
    default: da_platform

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-ae83c2ba-d87c.cloud.databricks.com
      root_path: /Workspace/Users/joshua.strickland@satsyil.com/onr_itss_poc
    variables:
      catalog: onr_itss_poc
      schema: da_platform
