# Folder:    /Workspace/Users/joshua.strickland@satsyil.com/onr_itss_poc
# Catalog:   onr_itss_poc.da_platform
#
# This Git folder is the source of truth. The pipeline is created from
# resources/pipelines.yml — either manually in the UI (Workflows -> Lakeflow
# pipelines, compute = Serverless) or with `databricks bundle deploy -t dev`
# where the CLI is available. No cluster creation is required either way.

bundle:
  name: onr_itss_poc

include:
  - resources/*.yml

sync:
  include:
    - src/**
    - data/**
    - docs/**
  exclude:
    - src/dashboards/*.lvdash.json

variables:
  catalog:
    default: onr_itss_poc
  schema:
    default: da_platform

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-ae83c2ba-d87c.cloud.databricks.com
      root_path: /Workspace/Users/joshua.strickland@satsyil.com/onr_itss_poc
    variables:
      catalog: onr_itss_poc
      schema: da_platform
