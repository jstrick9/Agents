resources:
  dashboards:
    executive_lakeview:
      display_name: ONR Executive D and A ${bundle.target}
      file_path: ../src/dashboards/onr_executive.lvdash.json
      warehouse_id: ${var.warehouse_id}
      embed_credentials: false
      permissions:
        - level: CAN_READ
          group_name: ${var.executives_group}
        - level: CAN_READ
          group_name: ${var.analysts_group}
        - level: CAN_MANAGE
          group_name: ${var.engineers_group}
