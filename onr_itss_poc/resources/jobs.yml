resources:
  jobs:
    bootstrap:
      name: onr-itss-bootstrap-${bundle.target}
      max_retries: 1
      timeout_seconds: 1800
      tags:
        project: onr-itss-poc
      tasks:
        - task_key: bootstrap
          notebook_task:
            notebook_path: ../src/setup/00_bootstrap
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            environment_version: "4"

    run_pipeline:
      name: onr-itss-run-pipeline-${bundle.target}
      max_retries: 1
      timeout_seconds: 3600
      tags:
        project: onr-itss-poc
      tasks:
        - task_key: pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.onr_medallion.id}
            full_refresh: false
