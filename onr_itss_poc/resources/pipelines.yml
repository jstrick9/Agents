# ONR ITSS POC — intentionally empty.
#
# The medallion is Lakeflow-free: no pipeline is declared or created anywhere.
# `src/pipelines/medallion.sql` defines the bronze/silver streaming tables and the
# gold materialized views with plain SQL, run on the Serverless SQL warehouse
# (Databricks backs them with serverless-managed Lakeflow — visible in Catalog
# Explorer, nothing to operate). Re-running the notebook (`CREATE OR REFRESH`) is
# the deploy, the refresh, and the DR runbook.
#
# This file is kept so `databricks.yml`'s `include: resources/*.yml` remains the
# single extension point if a pipeline is ever reintroduced for GovCloud.
