resources:
  apps:
    executive_app:
      name: onr-exec-app-${bundle.target}
      description: Element 6 — non-technical leader search, filter, extract, anomaly review, approval routing.
      source_code_path: ../src/app
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: gold-kpis
          table:
            id: ${var.catalog}.${var.schema}.gold_executive_kpis
            permission: CAN_SELECT
        - name: gold-execution
          table:
            id: ${var.catalog}.${var.schema}.gold_financial_execution
            permission: CAN_SELECT
        - name: gold-anomalies
          table:
            id: ${var.catalog}.${var.schema}.gold_anomalies
            permission: CAN_SELECT
        - name: gold-approvals
          table:
            id: ${var.catalog}.${var.schema}.gold_approval_queue
            permission: CAN_SELECT
        - name: gold-vendors
          table:
            id: ${var.catalog}.${var.schema}.gold_vendor_lifecycle
            permission: CAN_SELECT
        - name: gold-quality
          table:
            id: ${var.catalog}.${var.schema}.gold_data_quality_scores
            permission: CAN_SELECT
        - name: gold-summary
          table:
            id: ${var.catalog}.${var.schema}.gold_executive_summary
            permission: CAN_SELECT
        - name: gold-portfolio
          table:
            id: ${var.catalog}.${var.schema}.gold_grant_portfolio
            permission: CAN_SELECT
        - name: export-volume
          volume:
            id: ${var.catalog}.${var.schema}.export
            permission: CAN_READ
