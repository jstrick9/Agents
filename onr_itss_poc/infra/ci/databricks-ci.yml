name: ONR ITSS POC CI

on:
  push:
    paths:
      - "onr_itss_poc/**"
      - ".github/workflows/databricks-ci.yml"
  pull_request:
    paths:
      - "onr_itss_poc/**"

defaults:
  run:
    working-directory: onr_itss_poc

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest
      - name: Pytest (no Spark required)
        run: pytest tests/ -q

  bundle-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate Asset Bundle syntax
        run: databricks bundle validate -t dev --output json || databricks bundle validate -t dev
        env:
          # Optional — syntax validation often works without a host; deploy needs these.
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        continue-on-error: true
